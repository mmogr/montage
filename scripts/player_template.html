<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg:#0f1210; --panel:#171c18; --line:#2a332c; --ink:#e9efe8; --dim:#93a196; --accent:#d9b44a; --accent2:#5fa86b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  header { padding:18px 20px 10px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; letter-spacing:.02em; }
  h1 span { color:var(--accent); }
  .meta { color:var(--dim); font-size:13px; }
  main { display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:16px; padding:0 20px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding:0 16px 16px; } }
  .stage { background:#000; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .frame { position:relative; aspect-ratio:16/9; }
  #player, .frame iframe { position:absolute; inset:0; width:100%; height:100%; }
  .bar { height:4px; background:var(--line); }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .25s linear; }
  .now { padding:12px 14px; background:var(--panel); border-top:1px solid var(--line); }
  .now .who { font-weight:600; }
  .now .who a { color:var(--ink); text-decoration:none; border-bottom:1px dotted var(--dim); }
  .now .t { color:var(--dim); font-size:13px; }
  .now q { display:block; margin-top:6px; color:#cfd8cd; font-style:italic; }
  .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { background:#222a24; color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent2); }
  .list { background:var(--panel); border:1px solid var(--line); border-radius:10px; max-height:calc(100vh - 110px); overflow:auto; }
  .item { display:flex; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; align-items:center; }
  .item:hover { background:#1d241f; }
  .item.on { background:#232d25; box-shadow: inset 3px 0 var(--accent); }
  .item img { width:96px; aspect-ratio:16/9; object-fit:cover; border-radius:4px; flex:none; background:#000; }
  .item .n { color:var(--dim); font-size:12px; width:18px; flex:none; text-align:right; }
  .item .c { font-size:13px; min-width:0; }
  .item .c b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .c span { color:var(--dim); font-size:12px; }
  kbd { background:#222a24; border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <div class="meta"><span id="count"></span> · plays each moment in place on YouTube, then skips to the next · <kbd>←</kbd> <kbd>→</kbd> <kbd>space</kbd></div>
</header>
<main>
  <section>
    <div class="stage">
      <div class="frame"><div id="player"></div></div>
      <div class="bar"><i id="prog"></i></div>
      <div class="now">
        <div class="who" id="who"></div>
        <div class="t" id="when"></div>
        <q id="quote"></q>
        <div class="controls">
          <button id="prev">◀ Prev</button>
          <button id="play">Play / Pause</button>
          <button id="next">Next ▶</button>
          <button id="replay">↺ Replay clip</button>
        </div>
      </div>
    </div>
  </section>
  <aside class="list" id="list"></aside>
</main>
<script>
const CLIPS = __CLIPS__;
let i = 0, player, ticker;
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.floor(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };

$("count").textContent = CLIPS.length + " creators";
$("list").innerHTML = CLIPS.map((c, k) => `
  <div class="item" data-k="${k}">
    <div class="n">${k+1}</div>
    <img loading="lazy" src="https://i.ytimg.com/vi/${c.id}/mqdefault.jpg" alt="">
    <div class="c"><b></b><span>${fmt(c.start)} · ${c.end - c.start}s</span></div>
  </div>`).join("");
document.querySelectorAll(".item").forEach((el, k) => {
  el.querySelector("b").textContent = CLIPS[k].channel;
  el.onclick = () => go(k);
});

function show() {
  const c = CLIPS[i];
  const a = document.createElement("a");
  a.href = `https://www.youtube.com/watch?v=${c.id}&t=${c.start}s`; a.target = "_blank"; a.rel = "noopener";
  a.textContent = c.channel;
  $("who").replaceChildren(a);
  $("when").textContent = `${c.title} — ${fmt(c.start)}–${fmt(c.end)}`;
  $("quote").textContent = c.quote || "";
  $("quote").style.display = c.quote ? "block" : "none";
  document.querySelectorAll(".item").forEach((el, k) => el.classList.toggle("on", k === i));
  document.querySelector(".item.on")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
let lastGo = 0;
function auto() { if (Date.now() - lastGo > 1500) go(i + 1); }  // ticker + ENDED can both fire; advance once
function go(k) {
  lastGo = Date.now();
  i = (k + CLIPS.length) % CLIPS.length;
  const c = CLIPS[i];
  player.loadVideoById({ videoId: c.id, startSeconds: c.start, endSeconds: c.end });
  show();
}
function tick() {
  if (!player?.getCurrentTime) return;
  const c = CLIPS[i], t = player.getCurrentTime();
  $("prog").style.width = Math.max(0, Math.min(1, (t - c.start) / (c.end - c.start))) * 100 + "%";
  if (t >= c.end - 0.15 && player.getPlayerState() === YT.PlayerState.PLAYING) auto();
}
function onYouTubeIframeAPIReady() {
  const c = CLIPS[0];
  player = new YT.Player("player", {
    videoId: c.id,
    playerVars: { start: c.start, end: c.end, autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1 },
    events: {
      onReady: () => { show(); ticker = setInterval(tick, 250); },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) auto(); },
      onError: () => auto(),
    },
  });
}
$("prev").onclick = () => go(i - 1);
$("next").onclick = () => go(i + 1);
$("replay").onclick = () => go(i);
$("play").onclick = () => player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(i + 1);
  else if (e.key === "ArrowLeft") go(i - 1);
  else if (e.key === " ") { e.preventDefault(); $("play").click(); }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>

[spec]
mode = "statements"
id = "planned_gop_midterm_reactions_probe"
description = "Republican politicians or party officials commenting on, analyzing, or reacting to the results of the 2026 midterm elections."
who = "Elected Republican officials (Presidents, Senators, Representatives, Governors, Mayors), Republican Party leadership (RNC chair, committee chairs), prominent Republican activists, or commentators explicitly identified as Republican strategists/analysts. Does not include Democrats, independents, or neutral news anchors unless quoting a Republican."
what = "The outcome of the 2026 midterm elections, specifically seat counts, control of Congress, specific wins/losses, or the overall performance of the party. Reactions can be positive (celebrating wins) or negative (explaining losses)."
after = "2026-11-02"
exclude_sources = ["Live election night coverage where the results are still being tabulated and no final outcome has been declared.", "Campaign ads or candidate speeches from before the election (prior to Nov 2026).", "General political commentary not directly tied to the specific results of the 2026 midterm.", "Videos that are primarily about the 2024 or 2028 elections unless explicitly comparing them to the 2026 results.", "Concession speeches by losing Republican candidates (e.g., 'I am disappointed', 'conceding defeat') unless followed by broader analysis of the party's performance.", "Videos featuring Democratic politicians (e.g., Chuck Schumer, Elise Stefanik in a D context, Amy Acton) unless they are quoting a Republican."]
topic_keywords = ["midterm", "election result", "voting", "turnout", "seat count", "congress", "senate", "house", "majority", "loss", "win", "defeat", "victory", "polling", "count", "ballot", "district", "republican", "gop", "mike johnson", "jd vance", "trump", "thune", "desantis", "ralph norman", "vivek ramaswamy", "zach lahn"]
interpretation = "This spec targets statements made by Republicans *after* the results of the 2026 midterms were known. It assumes 'midterm results' refers to the November 2026 election cycle given the current date (Nov 9, 2026). It includes both celebratory reactions to wins and analytical/post-mortem reactions to losses. The 'after' date is set to 2026-11-02 to ensure we only capture post-election commentary. The 'who' field is broad to capture elected officials and party leadership. I removed specific names from topic_keywords that might be too narrow or incorrect (like 'nixon' which was a hallucination in the draft, and 'stefanik' who is R-NY but appears in contexts with Democrats, though kept 'ralph norman' as a key 2026 candidate seen in chyrons). I added names frequently seen in the chyrons of the candidate videos (Norman, Ramaswamy, Lahn) to help window the correct segments."
game = ""

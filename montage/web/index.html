<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>montage</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1b1b1a; --muted: #6b6a66; --line: #e4e2dc;
    --accent: #c2410c; --accent-ink: #ffffff; --ok: #15803d; --warn: #b45309; --err: #b91c1c;
    --chip: #efede8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9b9a94; --line: #2e2e2b;
            --accent: #f97316; --accent-ink: #141413; --chip: #262624; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; }
  a { color: inherit; }
  header { display: flex; gap: 16px; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--line);
           background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; font-weight: 650; }
  form { flex: 1; display: flex; gap: 8px; max-width: 760px; }
  input[type=text] { flex: 1; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
                     background: var(--bg); color: var(--ink); min-width: 0; }
  button { font: inherit; padding: 9px 16px; border: 0; border-radius: 8px; background: var(--accent);
           color: var(--accent-ink); font-weight: 600; cursor: pointer; }
  button.ghost { background: var(--chip); color: var(--ink); font-weight: 500; padding: 6px 12px; }
  .wrap { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 66px); }
  aside { border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 8px 8px 6px; }
  .job { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; margin-bottom: 2px; }
  .job:hover, .job.on { background: var(--chip); }
  .job .q { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job .m { font-size: 12px; color: var(--muted); }
  main { padding: 24px 32px 64px; max-width: 1200px; }
  .empty { color: var(--muted); margin-top: 48px; }
  .status { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); }
  .status.running, .status.queued { color: var(--warn); } .status.done { color: var(--ok); } .status.error { color: var(--err); }
  h2.title { font-size: 22px; margin: 6px 0 4px; font-weight: 650; }
  .meta { color: var(--muted); font-size: 13px; }
  .interp { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 16px 0;
            font-size: 14px; }
  .interp b { font-weight: 600; }
  .progress { margin: 16px 0; }
  .progress .now { font-size: 15px; }
  details { margin-top: 6px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre.log { font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; background: var(--panel); border: 1px solid var(--line);
            border-radius: 8px; padding: 10px; max-height: 300px; overflow: auto; white-space: pre-wrap; }
  .bar { display: flex; gap: 8px; align-items: center; margin: 18px 0 10px; }
  .bar .n { font-weight: 600; margin-right: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex;
          flex-direction: column; }
  .media { position: relative; aspect-ratio: 16/9; background: #000; cursor: pointer; }
  .media img, .media iframe { width: 100%; height: 100%; object-fit: cover; border: 0; display: block; }
  .media .ts { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.78); color: #fff; font-size: 12px;
               padding: 2px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .media .play { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
  .media:hover .play { opacity: 1; }
  .media .play span { width: 54px; height: 54px; border-radius: 50%; background: rgba(0,0,0,.6); display: grid; place-items: center; }
  .media .play span::after { content: ""; border-left: 16px solid #fff; border-top: 10px solid transparent;
                             border-bottom: 10px solid transparent; margin-left: 4px; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
  .body .t { font-weight: 600; font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2;
             -webkit-box-orient: vertical; overflow: hidden; text-decoration: none; }
  .body .t:hover { text-decoration: underline; }
  .body .c { font-size: 12px; color: var(--muted); }
  .body .note { font-size: 12px; color: var(--muted); }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); align-self: flex-start; }
  .speaker { margin: 22px 0 8px; font-size: 16px; font-weight: 600; } .speaker span { color: var(--muted); font-weight: 400; }
  .quote { font-size: 13px; font-style: italic; }
  @media (max-width: 800px) {
    .wrap { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 180px; }
    main { padding: 16px; } header { flex-wrap: wrap; padding: 12px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>montage</h1>
  <form id="f"><input type="text" id="q" placeholder="Describe the moment, e.g. dogs seeing snow for the first time" autocomplete="off">
    <button>Search</button></form>
</header>
<div class="wrap">
  <aside><h2>Searches</h2><div id="jobs"></div></aside>
  <main id="main"><p class="empty">Describe a moment and montage will search YouTube for it, find the timestamps, and
    collect the clips here. A search takes a few minutes; you can leave this page and come back.</p></main>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ts = t => { t = Math.max(0, Math.floor(t)); const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0"); };
const ago = t => { const s = Date.now()/1000 - t; return s < 90 ? "just now" : s < 5400 ? Math.round(s/60) + " min ago"
  : s < 129600 ? Math.round(s/3600) + " h ago" : Math.round(s/86400) + " d ago"; };
let current = null, timer = null;

async function api(path, opts) { const r = await fetch(path, opts); return r.json(); }

async function loadJobs() {
  const jobs = await api("/api/jobs");
  $("#jobs").innerHTML = jobs.map(j => `<a class="job ${j.id === current ? "on" : ""}" href="/job/${j.id}" data-id="${j.id}">
    <span class="q">${esc(j.query)}</span>
    <span class="m">${j.status === "done" ? j.n + " results" : esc(j.status)} · ${ago(j.created)}</span></a>`).join("")
    || `<p class="meta" style="padding:0 8px">No searches yet.</p>`;
}

function card(it) {
  return `<div class="card">
    <div class="media" data-id="${esc(it.id)}" data-start="${it.start}">
      <img loading="lazy" src="https://i.ytimg.com/vi/${esc(it.id)}/mqdefault.jpg" alt="">
      <div class="play"><span></span></div><div class="ts">${ts(it.t)}</div></div>
    <div class="body">
      <a class="t" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a>
      <div class="c">${esc(it.channel)}</div>
      ${it.method === "statement" && it.note ? `<div class="quote">“${esc(it.note)}”</div>` : ""}
      ${it.method === "look" || it.method === "visual" ? `<span class="tag">${it.method === "look" ? "found by image search" : "found by visual similarity"}</span>` : ""}
      ${it.method === "look" && it.note ? `<div class="note">${esc(it.note)}</div>` : ""}
      ${(it.also || []).length ? `<div class="note">also in: ${it.also.map(a => `<a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title.slice(0, 40))}</a>`).join(", ")}</div>` : ""}
    </div></div>`;
}

function results(job) {
  const r = job.result || {}, items = r.items || [];
  let html = (r.notes || []).map(n => `<div class="interp" style="border-color:var(--warn)">${esc(n)}</div>`).join("") +
    `<div class="interp">${r.interpretation ? `<div><b>How it read your query:</b> ${esc(r.interpretation)}</div>` : ""}
    ${r.search ? `<div class="meta" style="margin-top:6px">${esc(r.search)}</div>` : ""}</div>
    <div class="bar"><span class="n">${items.length} ${r.mode === "statements" ? "statements" : "videos"}
      <span class="meta">from ${r.n_videos ?? "?"} searched · ${Math.round(r.total_s || 0)}s</span></span>
      <button class="ghost" id="copy">Copy markdown</button></div>`;
  if (!items.length) return html + `<p class="empty">Nothing matched.</p>`;
  if (r.mode === "statements") {
    const by = {};
    items.forEach(it => (by[it.speaker || "Unknown speaker"] ||= []).push(it));
    for (const [spk, its] of Object.entries(by).sort()) {
      html += `<div class="speaker">${esc(spk)} <span>${esc(its.find(i => i.role)?.role || "")}</span></div>
        <div class="grid">${its.map(card).join("")}</div>`;
    }
    return html;
  }
  return html + `<div class="grid">${items.map(card).join("")}</div>`;
}

async function show(id, push) {
  current = id; clearTimeout(timer);
  if (push) history.pushState({}, "", "/job/" + id);
  const job = await api("/api/jobs/" + id);
  if (job.error === "no such job") { $("#main").innerHTML = `<p class="empty">No such search.</p>`; return; }
  const last = job.log.length ? job.log[job.log.length - 1][1] : (job.status === "queued" ? "waiting for the previous search to finish" : "starting");
  const elapsed = job.started ? ((job.finished || Date.now()/1000) - job.started) : 0;
  let html = `<span class="status ${job.status}">${job.status}${job.queue_position ? " · #" + job.queue_position + " in queue" : ""}</span>
    <h2 class="title">${esc(job.result?.description || job.query)}</h2>
    <div class="meta">“${esc(job.query)}” · ${ago(job.created)}${elapsed ? " · " + ts(elapsed) + " elapsed" : ""}</div>`;
  if (job.status === "running" || job.status === "queued")
    html += `<div class="progress"><div class="now">${job.cancel ? "cancelling" : esc(last)}…</div>
      ${job.cancel ? "" : `<button class="ghost" id="cancel" style="margin-top:8px">Cancel search</button>`}</div>`;
  if (job.status === "cancelled") html += `<div class="interp">Cancelled.</div>`;
  if (job.status === "error") html += `<div class="interp" style="color:var(--err)">${esc(job.error)}</div>`;
  if (job.status === "done") html += results(job);
  html += `<details><summary>Progress log</summary><pre class="log">${esc(job.log.map(([t, m]) => ts(t) + "  " + m).join("\n"))}</pre></details>`;
  $("#main").innerHTML = html;
  const x = $("#cancel"); if (x) x.onclick = async () => { x.disabled = true; await api("/api/jobs/" + id + "/cancel", {method: "POST"}); show(id); };
  const c = $("#copy"); if (c) c.onclick = () => navigator.clipboard.writeText(job.markdown || "").then(() => c.textContent = "Copied");
  loadJobs();
  if (job.status === "running" || job.status === "queued") timer = setTimeout(() => show(id), 2000);
}

document.addEventListener("click", e => {
  const m = e.target.closest(".media");
  if (m && !m.querySelector("iframe")) {
    m.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(m.dataset.id)}?start=${m.dataset.start}&autoplay=1"
      allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    return;
  }
  const j = e.target.closest(".job");
  if (j) { e.preventDefault(); show(j.dataset.id, true); }
});
$("#f").onsubmit = async e => {
  e.preventDefault();
  const q = $("#q").value.trim(); if (!q) return;
  const job = await api("/api/jobs", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({query: q})});
  if (job.id) { $("#q").value = ""; show(job.id, true); }
};
window.onpopstate = () => { const m = location.pathname.match(/^\/job\/(.+)$/); m ? show(m[1]) : (current = null, loadJobs()); };
const m0 = location.pathname.match(/^\/job\/(.+)$/); if (m0) show(m0[1]); else loadJobs();
setInterval(() => { if (!timer) loadJobs(); }, 10000);
</script>
</body>
</html>
